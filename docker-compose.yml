services:
  db:
    image: postgres:16
    container_name: lts-pg
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: lts_timetrack
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lts_timetrack"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
