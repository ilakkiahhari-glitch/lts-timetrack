services:
  db:
    image: postgres:16
    container_name: lts-pg
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: lts_timetrack
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lts_timetrack"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: lts-redis
    # Shared rate limits and the short-lived fresh-QR-token cache (REDIS_URL). Holds only expiring data.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"   # localhost only; never expose Redis publicly
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
